<!DOCTYPE html>

<html>

<head>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
	<!-- the entire body must be written by student -->
	<form class="needs-validation" novalidate>
  <div class="container">

    <h1 class="text-center my-4">Internship Form</h1>

    <div class="row">
      <div class="col-md-4">
        <label for="first-name-input" class="form-label">First Name</label>
        <input type="text" id="first-name-input" class="form-control" required>
        <div class="invalid-feedback">
          First name required!
        </div>
      </div>

      <div class="col-md-4">
        <label for="last-name-input" class="form-label">Last Name</label>
        <input type="text" id="last-name-input" class="form-control" required>
        <div class="invalid-feedback">
          Last name required!
        </div>
      </div>

      <div class="col-md-4">
        <label for="email-input" class="form-label">Email Address</label>
        <input type="email" id="email-input" class="form-control" placeholder="xyz@abc.com" required>
        <div class="invalid-feedback">
          Email required!
        </div>
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-md-6">
        <label for="college-input" class="form-label">College</label>
        <input type="text" id="college-input" class="form-control" required>
        <div class="invalid-feedback">
          Please provide a valid college.
        </div>
      </div>

      <div class="col-md-3">
        <label for="grad-year-select" class="form-label">Graduation Year</label>
        <select id="grad-year-select" class="form-select" required>
          <option value="">Choose...</option>
          <option>2020</option>
          <option>2021</option>
          <option>2022</option>
          <option>2023</option>
        </select>
        <div class="invalid-feedback">
          Please select a valid Graduation Year.
        </div>
      </div>

      <div class="col-md-3">
        <label for="roll-no-input" class="form-label">Roll No.</label>
        <input type="text" id="roll-no-input" class="form-control" required>
        <div class="invalid-feedback">
          Please provide a valid Roll no.
        </div>
      </div>
    </div>

    <div class="form-check mt-3">
      <input class="form-check-input" type="checkbox" id="conditions-checkbox" required>
      <label class="form-check-label" for="conditions-checkbox">
        Agree to terms and conditions
      </label>
      <div class="invalid-feedback">
        You must agree before submitting.
      </div>
    </div>

    <button type="submit" class="btn btn-primary mt-3">
      Submit form
    </button>

  </div>
</form>
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
